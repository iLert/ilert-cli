name: docker-release

on:
  release:
    types:
      - published

# This job holds a Docker Hub token; it has no business writing anything back
# to the repository. `contents: read` is all `actions/checkout` needs.
permissions:
  contents: read

jobs:
  deploy:
    if: "!github.event.release.prerelease"
    name: Build and publish to docker hub
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SERVICE_NAME: ilert-cli
      REGISTRY: ilert

    steps:
      # Actions are pinned to full commit SHAs, the only immutable reference
      # GitHub offers: a tag can be repointed at new code by whoever owns the
      # action, and that code would run in this job alongside the registry
      # token. Update the SHA and the trailing version comment together.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build does not push to git, so the job never needs the token
          # left behind in .git/config.
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build, tag, and push image
        id: build-image
        env:
          IMAGE_TAG_1: ${{ github.sha }}
          IMAGE_TAG_2: ${{ github.event.release.tag_name }}
        run: |
          docker build -t ${REGISTRY}/${SERVICE_NAME}:${IMAGE_TAG_1} -t ${REGISTRY}/${SERVICE_NAME}:${IMAGE_TAG_2} -t ${REGISTRY}/${SERVICE_NAME}:latest .
          docker push ${REGISTRY}/${SERVICE_NAME}:${IMAGE_TAG_1}
          docker push ${REGISTRY}/${SERVICE_NAME}:${IMAGE_TAG_2}
          docker push ${REGISTRY}/${SERVICE_NAME}:latest
